<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="popupTitle">Capitaine · Web cursor</title>
  <link rel="stylesheet" href="./popup.css">
  <script type="module" src="./popup.js"></script>
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <h1>Capitaine</h1>
      <span class="brand" data-i18n="webCursor">Web cursor</span>
    </header>

    <section class="panel" aria-label="Cursor preferences" data-i18n-aria-label="cursorPreferences">
      <label class="setting-row" for="enabled">
        <span class="setting-title" data-i18n="enabledGlobally">Enable globally</span>
        <input class="switch" id="enabled" type="checkbox" role="switch" disabled>
      </label>
      <div class="setting-row">
        <label class="setting-title" for="theme" data-i18n="displayMode">Appearance</label>
        <select id="theme" disabled>
          <option value="auto">Auto</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </section>

    <section class="panel site-panel" aria-label="Current site" data-i18n-aria-label="currentSite">
      <p class="hint" data-i18n="currentSite">Current site</p>
      <p id="current-host" class="hostname" data-i18n="reading">Reading…</p>
      <label class="setting-row site-toggle" for="site-enabled">
        <span class="setting-title" data-i18n="enabledOnSite">Enable on this site</span>
        <input class="switch" id="site-enabled" type="checkbox" role="switch" aria-describedby="site-hint" disabled>
      </label>
      <p class="hint" id="site-hint"></p>
    </section>

    <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
    <button id="open-options" class="secondary" type="button" data-i18n="openSettings">Open full settings</button>
    <footer class="page-footer"><a href="https://github.com/IsQuyet/capitaine-web-cursor" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
  </main>
</body>
</html>
